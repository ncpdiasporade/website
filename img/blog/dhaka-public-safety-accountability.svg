  <title id="title">সাত দিনের সংবাদে ঢাকায় ১১ মরদেহ</title>
  <desc id="desc">ঢাকার বিমূর্ত মানচিত্র, সাত দিনের সময়রেখা এবং এগারোটি চিহ্ন দিয়ে জননিরাপত্তার জবাবদিহি দেখানো সম্পাদকীয় চিত্র।</desc>
