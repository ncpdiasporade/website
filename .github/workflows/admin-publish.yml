name: Publish approved admin content

on:
  workflow_dispatch:
    inputs:
      publication_id:
        description: Private approved publication ID
        required: true
        type: string
      retry_platform:
        description: Optional single failed platform to retry
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: website-content-write-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      PUBLISHER_PAYLOAD_PATH: ${{ runner.temp }}/publisher/publication.json
      PUBLISHER_RESULTS_PATH: ${{ runner.temp }}/publisher/results.json
      PUBLISHER_CALLBACK_TOKEN: ${{ secrets.PUBLISHER_CALLBACK_TOKEN }}
      PUBLISHER_ADMIN_URL: ${{ vars.PUBLISHER_ADMIN_URL }}
      PUBLISHER_RETRY_PLATFORM: ${{ inputs.retry_platform }}
      SOCIAL_ADMIN_MODE: 'true'
    steps:
      - name: Validate private bridge configuration
        run: |
          if [ -z "$PUBLISHER_ADMIN_URL" ] || [ -z "$PUBLISHER_CALLBACK_TOKEN" ]; then
            echo "The private publisher bridge is not configured." >&2
            exit 1
          fi
          mkdir -p "$(dirname "$PUBLISHER_PAYLOAD_PATH")"

      - name: Fetch approved immutable snapshot
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $PUBLISHER_CALLBACK_TOKEN" \
            "$PUBLISHER_ADMIN_URL/api/internal/publications/${{ inputs.publication_id }}" \
            -o "$PUBLISHER_PAYLOAD_PATH"

      - name: Check out latest live branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install publishing dependencies and Bengali fonts
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Project approved canonical content
        run: npm run publisher:admin -- project

      - name: Generate existing share pages and validate
        run: |
          npm run generate:blog-previews
          npm run validate

      - name: Commit validated website projection
        run: |
          git add data/recent-updates.json data/blog-posts.json
          if [ -d blog ]; then git add blog; fi
          if [ -d img/blog/publisher ]; then git add img/blog/publisher; fi
          if [ -d img/social/publisher ]; then git add img/social/publisher; fi
          if [ -d img/social/outbound ]; then git add img/social/outbound; fi
          if git diff --cached --quiet; then
            echo "Stable projection already exists; no website commit needed."
            exit 0
          fi
          git config user.name "ncpda-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish approved admin content ${{ inputs.publication_id }}"
          git pull --rebase origin main
          git push origin main

      - name: Publish selected platform deliveries
        env:
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          NCPDA_GERMANY_PAGE_ID: ${{ vars.NCPDA_GERMANY_PAGE_ID }}
          NCPDA_GERMANY_PAGE_ACCESS_TOKEN: ${{ secrets.NCPDA_GERMANY_PAGE_ACCESS_TOKEN }}
          META_INSTAGRAM_USER_ID: ${{ vars.META_INSTAGRAM_USER_ID }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS }}
          X_PUBLISHING_MODE: ${{ vars.X_PUBLISHING_MODE }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npm run publisher:admin -- publish

      - name: Reconcile Facebook identity into Recent Updates
        run: |
          npm run publisher:admin -- reconcile
          git add data/recent-updates.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "ncpda-publisher[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reconcile Facebook publication ${{ inputs.publication_id }}"
          git pull --rebase origin main
          git push origin main

      - name: Validate final repository state
        run: npm run validate

      - name: Report private delivery outcomes
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ ! -s "$PUBLISHER_RESULTS_PATH" ]; then
            jq -n --arg id "${{ inputs.publication_id }}" --arg status "$JOB_STATUS" \
              '{publicationId:$id,deliveries:[{platform:"website",status:"FAILED",error:("Workflow " + $status)}]}' > "$PUBLISHER_RESULTS_PATH"
          fi
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $PUBLISHER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@$PUBLISHER_RESULTS_PATH" \
            "$PUBLISHER_ADMIN_URL/api/internal/results"
