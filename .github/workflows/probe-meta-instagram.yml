name: Probe Meta Instagram connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify linked Instagram professional account
        env:
          META_GRAPH_VERSION: ${{ vars.META_GRAPH_VERSION }}
          NCPDA_GERMANY_PAGE_ID: ${{ vars.NCPDA_GERMANY_PAGE_ID }}
          NCPDA_GERMANY_PAGE_ACCESS_TOKEN: ${{ secrets.NCPDA_GERMANY_PAGE_ACCESS_TOKEN }}
        run: |
          node <<'NODE'
          const version = process.env.META_GRAPH_VERSION || 'v24.0';
          const pageId = process.env.NCPDA_GERMANY_PAGE_ID;
          const token = process.env.NCPDA_GERMANY_PAGE_ACCESS_TOKEN;
          if (!pageId || !token) throw new Error('Meta Page ID or Page access token is not configured.');
          console.log(`::add-mask::${token}`);
          const url = new URL(`https://graph.facebook.com/${version}/${pageId}`);
          url.searchParams.set('fields', 'name,instagram_business_account{id,username},connected_instagram_account{id,username}');
          url.searchParams.set('access_token', token);
          const response = await fetch(url);
          const payload = await response.json();
          if (!response.ok) throw new Error(`Meta connection probe failed (${response.status}): ${payload?.error?.message || 'Unknown provider error'}`);
          const account = payload.instagram_business_account || payload.connected_instagram_account;
          if (!account?.id) throw new Error('The Facebook Page has no linked Instagram professional account.');
          console.log(`Facebook Page: ${payload.name || pageId}`);
          console.log(`Instagram user ID: ${account.id}`);
          console.log(`Instagram username: ${account.username || 'not returned'}`);
          NODE
