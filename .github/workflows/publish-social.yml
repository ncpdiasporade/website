name: Publish Facebook-origin social posts

on:
  workflow_dispatch:
  schedule:
    - cron: '29 * * * *'
  workflow_run:
    workflows:
      - Sync official Facebook updates
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - data/recent-updates.json
      - data/blog-posts.json

permissions:
  contents: write

concurrency:
  group: website-content-write-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the live branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install publishing dependencies and Bengali fonts
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core

      - name: Prepare new Facebook and blog items
        run: |
          npm run social:prepare
          npm run social:status >> "$GITHUB_STEP_SUMMARY"
          npm run social:drafts >> "$GITHUB_STEP_SUMMARY"

      - name: Save the queue and outbound media
        run: |
          git add data/social-publishing-state.json data/social-review-queue.json
          if [ -d img/social/outbound ]; then
            git add img/social/outbound
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Prepare social publishing queue"
          git pull --rebase origin main
          git push origin main

      - name: Prepare TikTok access token
        continue-on-error: true
        env:
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_ACCESS_TOKEN_OUTPUT: ${{ runner.temp }}/tiktok-access-token
          TIKTOK_REFRESH_TOKEN_OUTPUT: ${{ runner.temp }}/tiktok-refresh-token
        run: |
          npm run social:auth
          if [ -s "$TIKTOK_ACCESS_TOKEN_OUTPUT" ]; then
            printf 'TIKTOK_ACCESS_TOKEN=%s\n' "$(tr -d '\n' < "$TIKTOK_ACCESS_TOKEN_OUTPUT")" >> "$GITHUB_ENV"
          fi

      - name: Persist a rotated TikTok refresh token
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_SECRETS_PAT }}
          ROTATED_TOKEN_FILE: ${{ runner.temp }}/tiktok-refresh-token
        run: |
          if [ ! -s "$ROTATED_TOKEN_FILE" ]; then
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "TikTok rotated its refresh token, but SOCIAL_SECRETS_PAT is not configured." >&2
            exit 1
          fi
          gh secret set TIKTOK_REFRESH_TOKEN < "$ROTATED_TOKEN_FILE"

      - name: Reconcile submitted TikTok posts
        run: npm run social:reconcile

      - name: Save reconciliation results
        run: |
          git add data/social-publishing-state.json data/social-review-queue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Reconcile social publishing status"
          git pull --rebase origin main
          git push origin main

      - name: Claim automatic Facebook-origin posts
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: npm run social:claim -- --approval automatic --claim-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Save the claim before external publishing
        run: |
          git add data/social-review-queue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Claim automatic social publications"
          git pull --rebase origin main
          git push origin main

      - name: Publish the claimed posts
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SOCIAL_FAILURE_OUTPUT: ${{ runner.temp }}/social-publishing-failures
        run: npm run social:execute -- --claim-id "${{ github.run_id }}-${{ github.run_attempt }}"

      - name: Validate and save publishing results
        run: |
          npm run validate
          git add data/social-publishing-state.json data/social-review-queue.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record automatic social publications"
          git pull --rebase origin main
          git push origin main

      - name: Report platform publishing failures
        env:
          SOCIAL_FAILURE_OUTPUT: ${{ runner.temp }}/social-publishing-failures
        run: |
          if [ -s "$SOCIAL_FAILURE_OUTPUT" ]; then
            echo "One or more platform publications failed. The queue contains the redacted API error and will retry safely." >&2
            exit 1
          fi
