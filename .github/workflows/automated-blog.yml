name: Generate evidence-based Bangladesh analysis

on:
  workflow_dispatch:
    inputs:
      context:
        description: 'Optional current context or issue for the analyst'
        required: false
        type: string
      topics:
        description: 'Optional comma-separated preferred topics'
        required: false
        type: string
      requirements:
        description: 'Optional additional editorial requirements'
        required: false
        type: string
      publication_mode:
        description: 'Quality-gated auto-publication or review queue only'
        required: true
        default: 'quality-gated'
        type: choice
        options:
          - quality-gated
          - review-only
  schedule:
    - cron: '25 2 * * *'

permissions:
  contents: write

concurrency:
  group: automated-blog-agent
  cancel-in-progress: false

jobs:
  research-write-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check whether the agent is configured
        id: preflight
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "The automated blog agent is installed but paused: add the OPENAI_API_KEY repository secret to enable generation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the live branch
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Node.js
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        if: steps.preflight.outputs.enabled == 'true'
        run: npm ci

      - name: Research and generate today's analysis
        if: steps.preflight.outputs.enabled == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BLOG_MODEL: ${{ vars.OPENAI_BLOG_MODEL }}
          BLOG_AGENT_CONTEXT: ${{ inputs.context }}
          BLOG_AGENT_TOPICS: ${{ inputs.topics }}
          BLOG_AGENT_REQUIREMENTS: ${{ inputs.requirements }}
          BLOG_AGENT_PUBLICATION_MODE: ${{ inputs.publication_mode }}
        run: npm run blog:generate

      - name: Generate share pages and validate
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          npm run generate:blog-previews
          npm run validate

      - name: Save the result
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          git add data/blog-posts.json data/blog-agent-review-queue.json data/blog-agent-runs.json
          if [ -d blog ]; then
            git add blog
          fi
          if git diff --cached --quiet; then
            echo "The agent produced no repository changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate daily evidence-based blog analysis"
          git pull --rebase origin main
          git push origin main
